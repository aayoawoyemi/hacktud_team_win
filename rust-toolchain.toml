# CONCEPT: pins the Rust compiler every machine uses for this repo.
# WHY: WP-12 R12.2, updated for D-13 (SpacetimeDB replaces gRPC; Aayo 6:05pm: upgrade Rust, newest SpacetimeDB).
#      SpacetimeDB 2.12 and later need Rust >= 1.97; 1.99.1 is the latest stable (Oct 13). An exact version, not
#      "stable": "stable" moves every six weeks and could break one machine mid-hackathon.
# DEPENDS ON: rustup. The first cargo command in this folder downloads 1.99.1 (and the wasm32 target) automatically.
#      Machines need rustup itself (https://rustup.rs).
# AFFECTS: every crate. `wasm32-unknown-unknown` is what SpacetimeDB modules compile to (crates/control, built by
#      `spacetime build` / `spacetime publish` on the main machine). Helpers only build native code; the target
#      is listed here so the one machine that publishes never needs a manual `rustup target add`.
[toolchain]
channel = "1.99.1"
targets = ["wasm32-unknown-unknown"]
