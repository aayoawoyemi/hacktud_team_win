# CONCEPT: bench crate, owned by WP-8. Benchmark and demo runner: sends prompts to the endpoint and writes one BenchResult per request.
# WHY: workspace skeleton from WP-12 R12.1; the demo's numbers (tokens/s, TTFT) must come from a repeatable runner, not a stopwatch.
# DEPENDS ON: contracts (BenchResult, ServerTimings, ErrorInfo), netcheck (RFC 3339 timestamp helper, reused, not copied).
# AFFECTS: WP-13 runbook and WP-14 write-up (consume the numbers).
# No HTTP client crate on purpose: llama-server on the LAN speaks plain HTTP/1.1, and a std TcpStream + a ~20-line
# chunked decoder is all the runner needs (same approach as the coordinator's /health probe). Rejected: reqwest
# (pulls hyper + tokio + TLS for a plaintext LAN call).
[package]
name = "bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
contracts = { workspace = true }
netcheck = { path = "../netcheck" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Dev binary until the shared CLI (O-02) exists: `cargo run -p bench -- bench.toml`
[[bin]]
name = "bench"
path = "src/bin/bench.rs"
