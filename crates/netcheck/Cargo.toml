# CONCEPT: netcheck crate, owned by WP-10. Reachability, round-trip time and throughput tool between machines.
# WHY: WP-10 R10.1/R10.3. Token latency in a layer split is dominated by per-hop RTT (PRD §4.2); the team needs
#      measured numbers per network option (O-05) and a pass/fail check of every port before launch.
# DEPENDS ON: serde + serde_json (JSON output in the §6.9 NetcheckResult shape), toml (targets file).
#      Not `contracts` yet: NetcheckResult lives on the WP-2 branch (PR #18), not on main. src/result.rs mirrors
#      its JSON shape field for field; swap to `contracts::NetcheckResult` once #18 merges.
# AFFECTS: planner (WP-5 uses RTT), coordinator status (WP-7), docs/network.md (the preflight commands).
#
# Rejected: tokio. A probe is a few dozen blocking connects and one bulk transfer; std::net + threads is enough,
#           and keeps the dev binary free of an async runtime. Rejected: clap. O-02 puts every tool behind one
#           shared CLI later, so the dev binary uses a tiny hand-rolled parser that is easy to delete.
[package]
name = "netcheck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Dev binary until the shared CLI (O-02) exists. `cargo run -p netcheck -- <check|serve|client> ...`
[[bin]]
name = "netcheck"
path = "src/bin/netcheck.rs"
