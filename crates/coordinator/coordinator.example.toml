# Example coordinator config (O-24). Copy, edit, run: SPACETIME_TOKEN=<publisher token> coordinator coordinator.toml
# Every key is optional; defaults come from contracts::defaults.
spacetime_uri = "http://127.0.0.1:3000"
spacetime_db = "pool"
llama_server_path = "/Users/you/llama-b8665/llama-b8665/llama-server"
model_path = "/Users/you/models/model.gguf"
model_id = "model"
ctx_size = 4096
host = "0.0.0.0"
port = 8080
log_dir = "/tmp"
ready_timeout_s = 300
# Address other machines use for llama-server (shown as the endpoint). Default: main's LAN IP when host is 0.0.0.0.
# public_host = "192.168.8.174"
# Wait for this many helpers before the first load (avoids loading the model twice at startup).
min_helpers = 1
# Checkpoint S speed flags (passed to llama-server as-is):
# flash_attn = "on"
# extra_args = ["-ctk", "q8_0", "-ctv", "q8_0"]          # KV cache in 8 bit
# extra_args = ["--spec-type", "ngram-simple"]           # speculative decoding, no draft model
# tensor_split = [12, 12, 9]                              # -ts layer counts, RPC devices first, main last
# Models the dashboard can switch to (control's request_model -> coordinator re-plans). id = GGUF path on main.
# model_id / model_path above is the default and need not be repeated. Only these ids are honored.
