# CONCEPT: coordinator crate, owned by WP-4 (+ WP-7 status in src/status/, WP-9 recovery in src/recovery/). Registry of nodes, launcher of llama-server on main, owner of the cluster state machine (PRD §5.6).
# WHY: workspace skeleton from WP-12 R12.1; the main machine (O-06: a Mac) needs one process that turns registered nodes plus a SplitPlan into a running llama-server.
# DEPENDS ON: contracts, planner (SplitPlan).
# AFFECTS: agent (sends it Commands), bench (reads ClusterStatus), the O-10 display.
# Library crate on purpose: O-02 (one CLI binary with subcommands vs one binary per crate) is still open.
# Adding src/main.rs later (or a separate CLI crate) is a one-file change either way.
[package]
name = "coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
contracts = { workspace = true }
spacetimedb-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
