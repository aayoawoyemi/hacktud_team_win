# CONCEPT: the one Cargo workspace for all team Rust code (PRD §5.7). Every crate under crates/ is a member,
#          so `cargo build` / `cargo test` at the repo root builds and tests everything with one lockfile.
# WHY: WP-12 R12.1. One workspace means one dependency resolution (no two versions of prost or spacetimedb fighting),
#      one target/ folder, and one command for Aries to run on every PR. O-01 (Rust supervises the official
#      llama.cpp binaries) means no C++ is built here; protox compiles the .proto type
#      schema in pure Rust, so no protoc is needed (D-13: SpacetimeDB is the control plane, no gRPC).
# DEPENDS ON: rust-toolchain.toml (pins the compiler, 1.99.1 + wasm32); crates/*/Cargo.toml.
# AFFECTS: every crate. Adding a crate = add it to `members` below. Shared dependency versions live in
#          [workspace.dependencies] so crates write `serde = { workspace = true }` instead of their own version.
#
# Rejected: a glob `members = ["crates/*"]`. Explicit names make a missing or misnamed folder a loud error,
# and keep the WP-5 planner hand-off visible (another agent moves his crate into crates/planner).

[workspace]
resolver = "3"
members = [
    "crates/contracts",   # WP-2: shared §6 types, llama.cpp output parsers, generated SpacetimeDB client bindings
    "crates/control",     # WP-2: the SpacetimeDB module (control-plane tables + reducers, D-13), built for wasm32
    "crates/agent",       # WP-3: node agent, supervises rpc-server
    "crates/coordinator", # WP-4 (+ WP-7 status, WP-9 recovery modules)
    "crates/planner",     # WP-5: GGUF reader + fit calculator (PLACEHOLDER until WP-5 moves in)
    "crates/relay",       # WP-6: relay telemetry; proxy only if O-08 picks 6B
    "crates/bench",       # WP-8: benchmark and demo runner
    "crates/netcheck",    # WP-10: RTT and throughput tool
]

# CONCEPT: package metadata every member inherits with `version.workspace = true` etc.
# WHY: one place to bump the version / edition. edition 2024 needs rustc >= 1.85; SpacetimeDB 2.14 needs
#      >= 1.97; the pin (rust-toolchain.toml) is 1.99.1.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
# No `license` key on purpose: the project licence is not decided (O-18 names the project first).

# CONCEPT: the shared dependency catalog. Versions are chosen here once; member crates opt in.
# WHY (D-13, 6:10pm): SpacetimeDB replaces gRPC as the control plane, so tonic / tonic-prost are gone.
#      prost + protox stay only as codegen for the §6 serde types (the .proto is the type schema, not an RPC
#      definition; Aries correction on #11, 6:03pm). protox compiles it in pure Rust, so no protoc anywhere.
#      SpacetimeDB: the module crate (`spacetimedb`), the client SDK (`spacetimedb-sdk`) and the `spacetime`
#      CLI/server on main MUST be the same exact version: generated bindings and the server's wire format are
#      tied to it. Newest release at 6:16pm Nov 7: 2.14.1 (Aayo 6:05pm: newest SpacetimeDB).
# AFFECTS: crates/contracts (prost, protox, spacetimedb-sdk), crates/control (spacetimedb), and later the agent
#          and coordinator (spacetimedb-sdk through contracts). spacetimedb-sdk uses native-tls: the OS TLS stack on
#          Windows and macOS (no OpenSSL there, R12.5); Linux would need OpenSSL.
[workspace.dependencies]
contracts = { path = "crates/contracts" }
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
protox = "0.10.0"
spacetimedb = "=2.14.1"
spacetimedb-sdk = "=2.14.1"
log = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util", "sync"] }
